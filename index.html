<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <title>EasyQR — генератор QR</title>
  <meta name="description" content="Быстрый генератор QR-кодов для кикшеринга. Пресеты, история, офлайн.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">

    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M20 20v.01M17 20v.01M14 20v.01"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-name">EasyQR</h1>
        <p class="brand-sub">scan · share · ride</p>
      </div>
      <button id="btn-install" class="ghost-btn install-btn" hidden title="Установить приложение">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        <span>Установить</span>
      </button>
    </header>

    <main class="layout">

      <!-- ===== ЛЕВО: ОБЛАСТЬ РЕЗУЛЬТАТА + ПУЛЬТ ===== -->
      <section class="stage-col" aria-label="Результат">
        <div class="beam-shell" id="beam-shell">
          <div class="beam beam-a" aria-hidden="true"></div>
          <div class="beam beam-b" aria-hidden="true"></div>
          <div class="card stage" id="stage">
            <!-- фон из плавающих точек -->
            <canvas id="dots-bg" class="dots-bg" aria-hidden="true"></canvas>

            <!-- пусто -->
            <div id="view-empty" class="stage-view empty-view">
              <div class="empty-orb" aria-hidden="true"></div>
              <p class="empty-text">QR появится здесь</p>
            </div>

            <!-- орб генерации -->
            <div id="view-thinking" class="stage-view thinking-view" hidden>
              <div class="orb-glow" aria-hidden="true"></div>
              <svg class="orb-ring" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
                <circle cx="32" cy="32" r="28" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="44 132"/>
              </svg>
              <p class="thinking-text">GENERATING</p>
            </div>

            <!-- результат -->
            <div id="view-result" class="stage-view result-view" hidden>
              <div class="result-head">
                <span id="res-badge" class="badge">WHOOSH</span>
                <span id="res-time" class="mono res-time"></span>
              </div>
              <div id="qr-holder" class="qr-holder"></div>
              <div id="res-url" class="mono res-url"></div>
              <div class="result-foot">
                <span id="res-type" class="res-type"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- панель управления под областью QR: пресеты + ввод -->
        <section class="console card" aria-label="Генератор">
          <div class="presets-wrap">
            <div id="presets" class="presets" role="tablist" aria-label="Пресеты ссылок"></div>
            <button id="btn-add-preset" class="pill pill-add" title="Добавить пресет">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>

          <div class="input-card">
            <span id="prefix" class="input-prefix" title="Нажмите чтобы изменить шаблон">https://wsh.bike?s=</span>
            <input id="suffix" class="input-suffix" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
                   placeholder="номер" aria-label="Значение после =">
          </div>

          <div class="actions">
            <button id="btn-generate" class="primary-btn">Сгенерировать</button>
            <button id="btn-copy" class="ghost-btn icon-action" title="Скопировать ссылку" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <button id="btn-download" class="ghost-btn icon-action" title="Скачать PNG" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
            </button>
          </div>
          <div class="hint">Допишите номер и нажмите <kbd>Enter</kbd></div>
        </section>
      </section>

      <!-- ===== ПРАВО: ИСТОРИЯ ===== -->
      <aside class="history card" aria-label="История">
        <div class="history-head">
          <h2 class="history-title">История</h2>
          <button id="btn-clear-history" class="ghost-btn tiny" title="Очистить историю">Очистить</button>
        </div>
        <div id="history-list" class="history-list"></div>
        <div id="history-empty" class="history-empty">Пока пусто</div>
      </aside>
    </main>
  </div>

  <!-- Модалка пресета (открывается только по кнопке «+» или правкой шаблона) -->
  <div id="preset-modal" class="modal-overlay" hidden>
    <div class="modal card">
      <h3 class="modal-title">Новый пресет</h3>
      <label class="mini-label" for="mp-name">Название</label>
      <input id="mp-name" class="modal-input" type="text" placeholder="Whoosh" maxlength="18">
      <label class="mini-label" for="mp-url">Шаблон ссылки (заканчивается на = )</label>
      <input id="mp-url" class="modal-input mono" type="text" placeholder="https://wsh.bike?s=">
      <div class="modal-actions">
        <button id="mp-cancel" class="ghost-btn">Отмена</button>
        <button id="mp-save" class="primary-btn small">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/qrcode.js"></script>
  <script src="js/app.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
